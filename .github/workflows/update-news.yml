name: Auto Update News Feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'update_news.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run news update script
        run: python update_news.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json news.csv README.md
          if git diff --staged --quiet; then
            echo "No changes in news feed."
          else
            git commit -m "Auto update news feed: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi